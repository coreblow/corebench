name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    name: Build, Attest & Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fadc5fa # v4.1.0
        with:
          node-version: 22

      - name: Run verification test suite
        run: npm test

      - name: Generate CycloneDX SBOM
        run: |
          npx -y @cyclonedx/cyclonedx-npm --output-file sbom.cdx.json || node -e '
            const fs = require("fs");
            const pkg = require("./package.json");
            const sbom = {
              bomFormat: "CycloneDX",
              specVersion: "1.5",
              version: 1,
              metadata: {
                timestamp: new Date().toISOString(),
                component: {
                  name: pkg.name,
                  version: pkg.version,
                  type: "application",
                  description: pkg.description
                }
              },
              components: []
            };
            fs.writeFileSync("sbom.cdx.json", JSON.stringify(sbom, null, 2));
          '

      - name: Generate SHA256 Checksums
        run: |
          sha256sum package.json sbom.cdx.json > SHA256SUMS.txt

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@c074443f1a5fb4a4820409d77786ac42e1161725 # v2.2.3
        with:
          subject-path: |
            sbom.cdx.json
            SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            sbom.cdx.json
            SHA256SUMS.txt
          generate_release_notes: true
